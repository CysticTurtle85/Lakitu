org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false

# Mod properties, shared by every target in targets/
mod_id=lakitu
mod_name=Lakitu
mod_version=1.0.0
mod_description=Lakitus now haunt the mountains. Beat one, take its cloud, and rule the skies.
mod_authors=CysticTurtle85
mod_license=MIT
mod_homepage=https://github.com/CysticTurtle85/Lakitu
mod_sources=https://github.com/CysticTurtle85/Lakitu
mod_issues=https://github.com/CysticTurtle85/Lakitu/issues
maven_group=net.cystic.lakitu
# true when the mod renders anything with GeckoLib (adds the library, its metadata entries and Modrinth dependency)
geckolib=true

# Modrinth project the targets are published to (./gradlew modrinth, needs MODRINTH_TOKEN).
# Left empty until the project exists; the modrinth task is only configured once it's set.
modrinth_project=1xe0dRcT

# Modrinth "environment" for every uploaded version (set by the build after each upload): client_and_server when the mod
# adds blocks, items, entities, recipes or anything the server must know (most mods); others in the skill's
# references/modrinth.md.
modrinth_environment=client_and_server

fabric_loader_version=0.19.5
